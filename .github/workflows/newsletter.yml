name: Matt's weekly newsletter

on:
  schedule:
    # Once a week, Monday 08:17 in Ireland, including daylight saving time.
    - cron: '17 8 * * 1'
      timezone: Europe/Dublin
  workflow_dispatch:
    inputs:
      mode:
        description: Preview only, or send this week's edition
        type: choice
        required: true
        default: preview
        options:
          - preview
          - send

concurrency:
  group: matt-weekly-newsletter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  newsletter:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate content and delivery safeguards
        run: |
          python newsletter.py --check
          python -m unittest discover -s tests -v
      - name: Create review preview
        if: env.MODE == 'preview'
        run: python newsletter.py --demo
      - name: Send weekly edition
        if: env.MODE == 'send'
        env:
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}
          URL_WEB: ${{ vars.URL_WEB }}
        run: python newsletter.py --send
      - name: Persist delivery state and archive, including ambiguous delivery marker
        if: always() && env.MODE == 'send'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state docs
          if ! git diff --cached --quiet; then
            git commit -m "Record Matt's weekly newsletter and delivery state"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Save preview and recovery files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: matts-newsletter-${{ github.run_id }}
          path: |
            vista_previa.html
            vista_previa.txt
            previews/archive/
            docs/
            state/
          retention-days: 30

  publish-archive:
    needs: newsletter
    if: github.event_name == 'schedule' || inputs.mode == 'send'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish real archive
        id: deployment
        uses: actions/deploy-pages@v4
